<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    line-height: 1.5;
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 28px;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header h1 svg { color: #059669; }
  .header p { color: #64748b; font-size: 14px; margin-top: 4px; }
  .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .period-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 4px;
  }
  .period-nav button {
    background: transparent;
    border: none;
    padding: 4px 10px;
    cursor: pointer;
    color: #475569;
    border-radius: 4px;
    font-size: 18px;
    line-height: 1;
  }
  .period-nav button:hover { background: #f1f5f9; }
  .period-nav .period-label {
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    white-space: nowrap;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
  }
  .stat-label { font-size: 13px; color: #64748b; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .positive { color: #059669; }
  .negative { color: #dc2626; }

  .input-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
  }
  .panel h2 {
    font-size: 16px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel p.hint { color: #64748b; font-size: 12px; margin-bottom: 12px; }

  .input-target-banner {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .input-target-banner.viewing-past {
    background: #fef3c7;
    border-color: #fde68a;
    color: #92400e;
  }
  .input-target-banner strong { font-weight: 600; }

  textarea, input[type="text"], input[type="number"], input[type="date"], select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: white;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid #a78bfa; border-color: #a78bfa; }
  textarea { resize: vertical; min-height: 60px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .field-row select, .field-row input { font-size: 13px; }

  button {
    cursor: pointer;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-primary {
    background: #7c3aed;
    color: white;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary:hover { background: #6d28d9; }
  .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-secondary {
    background: #f1f5f9;
    color: #475569;
  }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-success {
    background: #059669;
    color: white;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-success:hover { background: #047857; }
  .btn-icon {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 8px;
    color: #475569;
  }
  .btn-icon:hover { background: #f8fafc; }

  .upload-zone {
    background: #f8fafc;
    border: 2px dashed #cbd5e1;
    border-radius: 8px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .upload-zone:hover { background: #f1f5f9; }
  .upload-zone svg { color: #94a3b8; }
  .upload-zone .main-text { font-size: 14px; font-weight: 500; color: #475569; }
  .upload-zone .sub-text { font-size: 12px; color: #94a3b8; }

  .error {
    color: #dc2626;
    font-size: 12px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .category-row {
    margin-bottom: 12px;
  }
  .category-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .category-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    color: #334155;
    flex-wrap: wrap;
  }
  .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .category-amount { font-weight: 500; color: #475569; }
  .category-amount .of { color: #94a3b8; }
  .progress-bar {
    background: #f1f5f9;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .fixed-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    background: #ede9fe;
    color: #6d28d9;
    border-radius: 4px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .fixed-pill:hover { background: #ddd6fe; }
  .rollover-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    background: #dcfce7;
    color: #15803d;
    border-radius: 4px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .rollover-pill.negative { background: #fee2e2; color: #b91c1c; }
  .category-amount .rolled { font-size: 12px; color: #15803d; font-weight: 600; }
  .category-amount .rolled.negative { color: #b91c1c; }
  /* Quick-add favorites */
  .favorites-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .fav-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    background: #f1f5f9;
    color: #1e293b;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .fav-chip:hover { background: #ede9fe; border-color: #c4b5fd; }
  .fav-chip .fav-amt { color: #6d28d9; }
  .fav-chip .fav-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .fav-manage {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    background: transparent;
    color: #6d28d9;
    border: 1px dashed #c4b5fd;
    border-radius: 999px;
    cursor: pointer;
  }
  .fav-manage:hover { background: #f5f3ff; }
  .fav-empty { font-size: 12px; color: #94a3b8; }
  .fav-edit-row {
    display: grid;
    grid-template-columns: 1.4fr 90px 1.2fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .fav-edit-row input, .fav-edit-row select { font-size: 13px; }
  .rollover-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 13px;
    color: #475569;
    cursor: pointer;
  }
  .rollover-toggle input { width: auto; }
  .rollover-select {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 13px;
    color: #475569;
  }
  .rollover-select label { white-space: nowrap; }
  .rollover-select select { flex: 1; font-size: 13px; }
  .pool-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; padding: 2px 6px;
    background: #e0f2fe; color: #0369a1; border-radius: 4px;
    margin-left: 6px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .pool-pill.draw { background: #fef3c7; color: #b45309; }
  .pool-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    padding: 14px 16px; margin-bottom: 18px;
    background: linear-gradient(135deg, #f0f9ff, #eef2ff);
    border: 1px solid #bae6fd; border-radius: 12px;
  }
  .pool-card .pool-main { display: flex; flex-direction: column; }
  .pool-card .pool-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #0369a1;
  }
  .pool-card .pool-value { font-size: 26px; font-weight: 800; color: #0c4a6e; }
  .pool-card .pool-value.negative { color: #b91c1c; }
  .pool-card .pool-sub { font-size: 12px; color: #475569; }
  .pool-card .pool-members { font-size: 12px; color: #64748b; margin-left: auto; text-align: right; max-width: 45%; }
  .category-row .edit-fixed {
    margin-top: 6px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #faf5ff;
    border: 1px solid #e9d5ff;
    border-radius: 8px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .category-row .edit-fixed.open { display: flex; }
  .category-row .edit-fixed label { color: #475569; }
  .category-row .edit-fixed input { width: 100px; font-size: 13px; padding: 4px 8px; }
  .category-row .edit-fixed .reset-btn {
    background: transparent;
    border: none;
    color: #7c3aed;
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .category-row .edit-fixed .reset-btn:hover { text-decoration: underline; }

  .tx-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .tx-row:hover {
    background: #f8fafc;
    border-color: #e2e8f0;
  }
  .tx-bar { width: 4px; height: 40px; border-radius: 2px; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-desc {
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tx-meta { font-size: 12px; color: #64748b; }
  .tx-meta .flex-badge {
    display: inline-block;
    padding: 1px 5px;
    background: #fef3c7;
    color: #92400e;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 4px;
  }
  .tx-amount {
    font-weight: 600;
    font-size: 14px;
    width: 80px;
    text-align: right;
  }
  .tx-row select {
    width: auto;
    font-size: 12px;
    padding: 4px 8px;
  }
  .icon-btn {
    background: transparent;
    color: #cbd5e1;
    padding: 6px;
    border: none;
    cursor: pointer;
    border-radius: 4px;
  }
  .icon-btn:hover { color: #dc2626; background: #fee2e2; }

  .empty {
    text-align: center;
    padding: 32px;
    color: #94a3b8;
    font-size: 14px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal {
    background: white;
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 20px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 16px; }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .flex-choice {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .flex-option {
    display: block;
    padding: 16px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    background: white;
    width: 100%;
    font-family: inherit;
  }
  .flex-option:hover {
    border-color: #a78bfa;
    background: #faf5ff;
  }
  .flex-option-title {
    font-weight: 600;
    font-size: 14px;
    color: #0f172a;
    margin-bottom: 4px;
  }
  .flex-option-detail {
    font-size: 12px;
    color: #64748b;
  }

  .cat-edit-block {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fafafa;
  }
  .cat-edit-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .cat-edit-row input[type="color"] {
    width: 38px;
    height: 38px;
    padding: 2px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    cursor: pointer;
    background: white;
  }
  .cat-edit-row input[type="text"].cat-name-input { flex: 1; min-width: 150px; }
  .cat-edit-row .budget-input {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cat-edit-row .budget-input span { color: #64748b; font-size: 13px; }
  .cat-edit-row .budget-input input { width: 90px; }

  .fixed-fields {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 12px;
    align-items: center;
    margin-top: 8px;
    font-size: 13px;
  }
  .fixed-fields label { color: #64748b; }
  .fixed-fields .fixed-amount {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .fixed-fields .fixed-amount span { color: #64748b; font-size: 13px; }
  .fixed-fields .fixed-amount input { width: 100px; }

  .add-row-btn {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: transparent;
    border: 2px dashed #cbd5e1;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .add-row-btn:hover { background: #f8fafc; }

  .parse-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    margin-bottom: 6px;
    background: white;
  }
  .parse-row.unselected {
    background: #f8fafc;
    opacity: 0.5;
  }
  .parse-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .parse-row .desc-input {
    flex: 1;
    font-size: 13px;
    padding: 4px 8px;
  }
  .parse-row .date-input {
    width: 130px;
    font-size: 13px;
    padding: 4px 8px;
  }
  .parse-row select {
    width: auto;
    font-size: 12px;
    padding: 4px 8px;
  }
  .parse-row .amount-input {
    width: 90px;
    text-align: right;
    font-weight: 600;
    font-size: 13px;
    padding: 4px 8px;
  }

  .csv-preview {
    margin-bottom: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
    font-size: 12px;
  }
  .csv-preview table { width: 100%; border-collapse: collapse; }
  .csv-preview th {
    background: #f8fafc;
    padding: 8px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
    font-weight: 600;
  }
  .csv-preview td {
    padding: 8px;
    border-bottom: 1px solid #f1f5f9;
  }
  .csv-preview tr:last-child td { border-bottom: none; }
  .map-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .map-row label { font-size: 13px; font-weight: 500; width: 110px; color: #334155; }
  .map-row select { flex: 1; }

  .bulk-area { margin-bottom: 8px; min-height: 100px; }

  .icon { width: 18px; height: 18px; stroke-width: 2; }
  .icon-sm { width: 14px; height: 14px; stroke-width: 2; }
  .icon-lg { width: 24px; height: 24px; stroke-width: 2; }

  .actions-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .actions-bar button { font-size: 13px; padding: 6px 12px; }

  .help-text {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    line-height: 1.4;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid #e2e8f0;
  }
  .tab {
    padding: 8px 12px;
    background: transparent;
    color: #64748b;
    font-size: 13px;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    margin-bottom: -1px;
  }
  .tab.active {
    color: #7c3aed;
    border-bottom-color: #7c3aed;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .header h1 { font-size: 22px; }
    .tx-amount { width: 70px; }
    .tx-row select { display: none; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const ICONS = {
  dollar: '<svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  settings: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',

// where month is 0-based and half = 0 for the 1st–15th, 1 for the 16th–EOM.
// Adding/subtracting 1 always moves to the adjacent half-month, including

let state = {
  categories: [],
  transactions: [],
  fixedOverrides: {},
  favorites: [],
  currentPeriodId: 0,
  modal: null,
  editingCats: [],
  editingFavs: [],
  parseResults: null,
  csvData: null,
  manualText: '',
  manualError: '',
  fileError: '',
  inputTab: 'natural',
  bulkText: '',
  form: { amount: '', description: '', category: '', date: '' },
  openFixedEditor: null,
  // Pending Friday flex decision: { txData, oldPeriodId, newPeriodId }
  flexPrompt: null,
};

const STORAGE_KEY = 'budgetTracker:v4';

// Normalize categories to the current shape. rolloverMode is one of
// 'none' | 'self' | 'pool'. Older data used a boolean `rollover` (true == 'self').
function normalizeCategories(cats) {
  return (cats || []).map(c => ({
    name: c.name,
    budget: c.budget || 0,
    color: c.color || '#6b7280',
    keywords: c.keywords || [],
    fixedMonthly: c.fixedMonthly || 0,
    fixedDescription: c.fixedDescription || '',
    rolloverMode: c.rolloverMode || (c.rollover ? 'self' : 'none'),
  }));
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      state.categories = data.categories || DEFAULT_CATEGORIES;
      state.transactions = data.transactions || [];
      state.fixedOverrides = data.fixedOverrides || {};
      state.favorites = data.favorites || [];
    } else {
      // One-time migration from an older bi-weekly schema (v3/v2). The period
      // numbering changed with the semi-monthly switch, so any stored
      // periodOverride values and per-period fixed overrides no longer point at
      // the right period. Drop them — transactions then fall into their natural
      // half-month by date, and fixed bills use their standard half-of-monthly
      // split. Real transaction data (date, amount, category, etc.) is kept.
      const legacy = localStorage.getItem('budgetTracker:v3') || localStorage.getItem('budgetTracker:v2');
      if (legacy) {
        const oldData = JSON.parse(legacy);
        state.categories = oldData.categories || DEFAULT_CATEGORIES;
        state.transactions = (oldData.transactions || []).map(t => {
          const { periodOverride, ...rest } = t;
          return rest;
        });
        state.fixedOverrides = {};
        saveState();
      } else {
        state.categories = DEFAULT_CATEGORIES;
      }
    }
  } catch (e) {
    state.categories = DEFAULT_CATEGORIES;
  }
  state.categories = normalizeCategories(state.categories);
  if (!Array.isArray(state.favorites)) state.favorites = [];
  state.currentPeriodId = getCurrentPeriodId();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      categories: state.categories,
      transactions: state.transactions,
      fixedOverrides: state.fixedOverrides,
      favorites: state.favorites,
    }));
  } catch (e) { console.warn('Save failed', e); }
}

function parseISO(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Period bounds are derived directly from the semi-monthly period ID
// (see the note at the top): 1st half = 1st–15th, 2nd half = 16th–EOM.
function getCurrentPeriodId() {
  return getPeriodForDate(todayStr());
}
function getPeriodBounds(periodId) {
  const year = Math.floor(periodId / 24);
  const rem = periodId - year * 24;
  const month = Math.floor(rem / 2); // 0-based month
  const half = rem % 2;              // 0 = 1st–15th, 1 = 16th–EOM
  let start, end;
  if (half === 0) {
    start = new Date(year, month, 1);
    end = new Date(year, month, 15);
  } else {
    start = new Date(year, month, 16);
    end = new Date(year, month + 1, 0); // day 0 of next month = last day of this month
  }
  return { start, end, startISO: formatISO(start), endISO: formatISO(end) };
}
function formatPeriodLabel(periodId) {
  const { start, end } = getPeriodBounds(periodId);
  const opts = { month: 'short', day: 'numeric' };
  const sameYear = start.getFullYear() === end.getFullYear();
  const yearSuffix = !sameYear || end.getFullYear() !== new Date().getFullYear() ? `, ${end.getFullYear()}` : '';
  return `${start.toLocaleDateString('en-US', opts)} – ${end.toLocaleDateString('en-US', opts)}${yearSuffix}`;
}
function todayStr() { return formatISO(new Date()); }
function inPeriod(dateStr, periodId) {
  const { startISO, endISO } = getPeriodBounds(periodId);
  return dateStr >= startISO && dateStr <= endISO;
}

// Find which period a date falls into naturally (before any override)
function getPeriodForDate(dateStr) {
  const d = parseISO(dateStr);
  const half = d.getDate() <= 15 ? 0 : 1;
  return d.getFullYear() * 24 + d.getMonth() * 2 + half;
}

// Is the given date a payday (i.e. the last day of its period: the 15th or EOM)?
function isPaydayFriday(dateStr) {
  const periodId = getPeriodForDate(dateStr);
  const { endISO } = getPeriodBounds(periodId);
  return dateStr === endISO;
}

function getFixedForPeriod(periodId, categoryName) {
  const key = `${periodId}:${categoryName}`;
  if (state.fixedOverrides[key] !== undefined) return state.fixedOverrides[key];
  const cat = state.categories.find(c => c.name === categoryName);
  if (!cat) return 0;
  return (cat.fixedMonthly || 0) / 2;
}
function setFixedForPeriod(periodId, categoryName, value) {
  const key = `${periodId}:${categoryName}`;
  if (value === null || value === undefined) delete state.fixedOverrides[key];
  else state.fixedOverrides[key] = Number(value) || 0;
  saveState();
}
function resetFixedForPeriod(periodId, categoryName) {
  delete state.fixedOverrides[`${periodId}:${categoryName}`];
  saveState();
}

function categorize(description) {
  const text = (description || '').toLowerCase();
  for (const cat of state.categories) {
    if (!cat.keywords || cat.keywords.length === 0) continue;
    for (const kw of cat.keywords) {
      if (text.includes(kw.toLowerCase())) return cat.name;
    }
  }
  return 'Other';
}

function parseNaturalEntry(text, defaultDate) {
  if (!text || !text.trim()) return null;
  const clean = text.trim();
  const amountMatch = clean.match(/\$?\s*(\d+(?:\.\d{1,2})?)\s*(?:dollars?|bucks?)?/i);
  if (!amountMatch) return null;
  const amount = parseFloat(amountMatch[1]);
  if (isNaN(amount) || amount <= 0) return null;
  let date = defaultDate || todayStr();
  let dateExplicit = false;
  const lower = clean.toLowerCase();
  if (lower.includes('yesterday')) {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    date = formatISO(d);
    dateExplicit = true;
  } else if (lower.includes('today')) {
    date = todayStr();
    dateExplicit = true;
  } else if (/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/.test(clean)) {
    const dm = clean.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (dm) {
      const yr = dm[3] ? (dm[3].length === 2 ? '20' + dm[3] : dm[3]) : String(new Date().getFullYear());
      date = `${yr}-${String(dm[1]).padStart(2,'0')}-${String(dm[2]).padStart(2,'0')}`;
      dateExplicit = true;
    }
  } else if (/\b(\d+)\s+days?\s+ago\b/i.test(clean)) {
    const dm = clean.match(/\b(\d+)\s+days?\s+ago\b/i);
    const d = new Date();
    d.setDate(d.getDate() - parseInt(dm[1], 10));
    date = formatISO(d);
    dateExplicit = true;
  }
  let description = clean.replace(amountMatch[0], '').replace(/\b(i|spent|paid|bought|on|for|at|today|yesterday)\b/gi, ' ').replace(/\s+/g, ' ').trim();
  if (!description) description = clean;
  const onMatch = clean.match(/\bon\s+([a-zA-Z][a-zA-Z\s]+?)(?:\s+at\b|\s+for\b|\s+yesterday\b|\s+today\b|\s+\d|$)/i);
  let categoryHint = '';
  if (onMatch) categoryHint = onMatch[1].trim();
  let category = categorize(categoryHint || description);
  if (categoryHint) {
    const exact = state.categories.find(c => c.name.toLowerCase() === categoryHint.toLowerCase());
    if (exact) category = exact.name;
  }
  return { amount, description: description.slice(0, 100), category, date, dateExplicit };
}

function uid() { return Date.now() + '-' + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Get default date for new entries: if viewing current period, use today.
// Otherwise, use the last day of the viewed period (so it lands in that period).
function getDefaultEntryDate() {
  const currentId = getCurrentPeriodId();
  if (state.currentPeriodId === currentId) return todayStr();
  const { endISO } = getPeriodBounds(state.currentPeriodId);
  return endISO;
}

// A transaction is in a period if EITHER:
// - it has a periodOverride matching that period, OR
// - it has no override and its date naturally falls in that period
function getTxPeriod(tx) {
  if (tx.periodOverride !== undefined && tx.periodOverride !== null) return tx.periodOverride;
  return getPeriodForDate(tx.date);
}
function isTxInPeriod(tx, periodId) {
  return getTxPeriod(tx) === periodId;
}

function getCurrentPeriodTx() {
  return state.transactions.filter(t => isTxInPeriod(t, state.currentPeriodId));
}

function getSpendingByCategory() {
  const variable = {};
  state.categories.forEach(c => { variable[c.name] = 0; });
  getCurrentPeriodTx().forEach(t => {
    if (variable[t.category] !== undefined) variable[t.category] += t.amount;
    else variable['Other'] = (variable['Other'] || 0) + t.amount;
  });
  return variable;
}

// Total spent (variable + fixed) for one category in an arbitrary period.
function spentInPeriodForCat(categoryName, periodId) {
  let v = 0;
  state.transactions.forEach(t => {
    if (t.category === categoryName && isTxInPeriod(t, periodId)) v += t.amount;
  });
  return v + getFixedForPeriod(periodId, categoryName);
}

// The earliest period that has any transaction — the anchor for rollover so we
// don't accumulate "unspent budget" for periods before the user started.
function getFirstActivityPeriod() {
  let minP = null;
  state.transactions.forEach(t => {
    const p = getTxPeriod(t);
    if (minP === null || p < minP) minP = p;
  });
  return minP;
}

// Uncapped carried-over balance for a rollover category, as of (but not
// including) the given period. Unspent budget from every prior period adds to
// the pot; overspending draws it down. No ceiling — it can grow indefinitely
// (and can go negative if the category is chronically overspent).
function getRolloverCarry(categoryName, uptoPeriodId) {
  const cat = state.categories.find(c => c.name === categoryName);
  if (!cat || cat.rolloverMode !== 'self') return 0;
  const minP = getFirstActivityPeriod();
  if (minP === null || uptoPeriodId <= minP) return 0;
  let carry = 0;
  for (let p = minP; p < uptoPeriodId; p++) {
    carry += (cat.budget || 0) - spentInPeriodForCat(categoryName, p);
  }
  return carry;
}

// ---- Shared rollover pool ----
// Categories set to rolloverMode 'pool' feed one shared, spendable cushion.
// Any pooled category may overspend its base budget; the pool covers it.
// Unspent pooled budget adds to the pool. No cap.
function getPoolCategories() {
  return state.categories.filter(c => c.rolloverMode === 'pool');
}
// Pool balance carried IN to a period (all pooled categories' net over/under
// for every period from first activity up to — but not including — uptoPeriodId).
function getPoolCarryIn(uptoPeriodId) {
  const pool = getPoolCategories();
  if (!pool.length) return 0;
  const minP = getFirstActivityPeriod();
  if (minP === null || uptoPeriodId <= minP) return 0;
  let bal = 0;
  for (let p = minP; p < uptoPeriodId; p++) {
    pool.forEach(c => { bal += (c.budget || 0) - spentInPeriodForCat(c.name, p); });
  }
  return bal;
}
// Live pool balance INCLUDING the given (current) period's activity so far.
function getPoolLiveBalance(periodId) {
  const pool = getPoolCategories();
  if (!pool.length) return 0;
  let bal = getPoolCarryIn(periodId);
  pool.forEach(c => { bal += (c.budget || 0) - spentInPeriodForCat(c.name, periodId); });
  return bal;
}

// Try to add a transaction. If it's on a payday Friday AND the viewing period differs from the natural period,
// or if it's on a Friday and could go either way, prompt user.
function attemptAddTransaction(txData) {
  // txData: { amount, description, category, date, source, dateExplicit }
  const naturalPeriod = getPeriodForDate(txData.date);

  // Case 1: date is a payday Friday → prompt for old (its period) vs new (next period)
  if (isPaydayFriday(txData.date)) {
    state.flexPrompt = {
      txData,
      oldPeriodId: naturalPeriod,
      newPeriodId: naturalPeriod + 1,
    };
    render();
    return;
  }

  // Case 2: viewing a different period than natural — assign to viewing period (the override mechanism)
  let periodOverride = null;
  if (naturalPeriod !== state.currentPeriodId) {
    periodOverride = state.currentPeriodId;
  }

  finalizeTransaction(txData, periodOverride);
}

function finalizeTransaction(txData, periodOverride) {
  const tx = {
    id: uid(),
    amount: txData.amount,
    category: txData.category,
    description: txData.description,
    date: txData.date,
    source: txData.source,
  };
  if (periodOverride !== null && periodOverride !== undefined) {
    tx.periodOverride = periodOverride;
  }
  state.transactions.unshift(tx);
  saveState();
}

function resolveFlexChoice(periodOverride) {
  // periodOverride === null means "use natural period (old)", a number means override
  const txData = state.flexPrompt.txData;
  const naturalPeriod = state.flexPrompt.oldPeriodId;
  let override = null;
  if (periodOverride !== naturalPeriod) {
    override = periodOverride;
  }
  finalizeTransaction(txData, override);
  state.flexPrompt = null;
  // Clear input fields after successful add
  if (txData.source === 'manual') state.manualText = '';
  if (txData.source === 'form') state.form = { amount: '', description: '', category: '', date: '' };
  render();
}

function cancelFlexChoice() {
  state.flexPrompt = null;
  render();
}

function addManualEntry() {
  state.manualError = '';
  const defaultDate = getDefaultEntryDate();
  const parsed = parseNaturalEntry(state.manualText, defaultDate);
  if (!parsed) {
    state.manualError = "Couldn't find an amount. Try 'spent $42 on groceries' or '$15 lunch yesterday'";
    render();
    return;
  }
  const txData = {
    amount: parsed.amount,
    category: parsed.category,
    description: parsed.description,
    date: parsed.date,
    source: 'manual',
  };
  attemptAddTransaction(txData);
  // If no flex prompt, clear input
  if (!state.flexPrompt) {
    state.manualText = '';
    render();
  }
}

function addFormEntry() {
  const amt = parseFloat(state.form.amount);
  if (isNaN(amt) || amt <= 0) { alert('Enter a valid amount.'); return; }
  const txData = {
    amount: amt,
    category: state.form.category || 'Other',
    description: state.form.description || state.form.category || 'Expense',
    date: state.form.date || getDefaultEntryDate(),
    source: 'form',
  };
  attemptAddTransaction(txData);
  if (!state.flexPrompt) {
    state.form = { amount: '', description: '', category: '', date: '' };
    render();
  }
}

function addBulkEntries() {
  const defaultDate = getDefaultEntryDate();
  const lines = state.bulkText.split('\n').map(l => l.trim()).filter(Boolean);
  const added = [];
  const failed = [];
  for (const line of lines) {
    const parsed = parseNaturalEntry(line, defaultDate);
    if (parsed) {
      const naturalPeriod = getPeriodForDate(parsed.date);
      const tx = {
        id: uid(), amount: parsed.amount, category: parsed.category,
        description: parsed.description, date: parsed.date, source: 'manual',
      };
      // For bulk, auto-assign to viewing period if natural differs (no prompt — bulk is fire-and-forget)
      if (naturalPeriod !== state.currentPeriodId) {
        tx.periodOverride = state.currentPeriodId;
      }
      added.push(tx);
    } else failed.push(line);
  }
  if (added.length) {
    state.transactions = [...added, ...state.transactions];
    state.bulkText = '';
    saveState();
  }
  alert(`Added ${added.length} entr${added.length === 1 ? 'y' : 'ies'}.${failed.length ? `\n${failed.length} couldn't be parsed:\n${failed.join('\n')}` : ''}`);
  render();
}

function deleteTransaction(id) {
  state.transactions = state.transactions.filter(t => t.id !== id);
  saveState();
  render();
}
function updateTxCategory(id, category) {
  state.transactions = state.transactions.map(t => t.id === id ? { ...t, category } : t);
  saveState();
  render();
}
function toggleTxPeriodOverride(id) {
  const tx = state.transactions.find(t => t.id === id);
  if (!tx) return;
  const natural = getPeriodForDate(tx.date);
  if (tx.periodOverride === undefined || tx.periodOverride === null) {
    // Currently in natural period; move to next period as override
    tx.periodOverride = natural + 1;
  } else {
    delete tx.periodOverride;
  }
  saveState();
  render();
}

// ---- Quick-add favorites ----
// A favorite is a saved one-tap expense: { id, label, amount, category, description }.

function parseCSV(text) {
  const rows = [];
  let cur = [], val = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { val += '"'; i++; }
      else if (c === '"') inQ = false;
      else val += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(val); val = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i+1] === '\n') i++;
        cur.push(val); val = '';
        if (cur.some(v => v.length > 0)) rows.push(cur);
        cur = [];
      } else val += c;
    }
  }
  if (val || cur.length) { cur.push(val); if (cur.some(v => v.length > 0)) rows.push(cur); }
  return rows;
}

function handleFileUpload(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  state.fileError = '';
  const isCSV = file.name.toLowerCase().endsWith('.csv') || file.type === 'text/csv';
  const isText = file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt');
  if (!isCSV && !isText) {
    state.fileError = 'Only CSV or text files supported.';
    event.target.value = '';
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const rows = parseCSV(e.target.result);
      if (rows.length < 2) throw new Error('File is empty or has no data rows.');
      state.csvData = {
        headers: rows[0],
        rows: rows.slice(1),
        mapping: {
          date: detectColumn(rows[0], ['date','transaction date','posted','post date']),
          description: detectColumn(rows[0], ['description','merchant','name','memo','details','payee']),
          amount: detectColumn(rows[0], ['amount','debit','charge','transaction amount','price']),
        },
        invertAmount: false,
      };
      state.modal = 'csv';
    } catch (err) {
      state.fileError = err.message || 'Failed to parse file.';
    }
    event.target.value = '';
    render();
  };
  reader.onerror = () => { state.fileError = 'File read failed.'; render(); };
  reader.readAsText(file);
}

function detectColumn(headers, candidates) {
  for (let i = 0; i < headers.length; i++) {
    const h = headers[i].toLowerCase().trim();
    for (const c of candidates) {
      if (h === c || h.includes(c)) return i;
    }
  }
  return -1;
}

function processCsvMapping() {
  const { headers, rows, mapping, invertAmount } = state.csvData;
  if (mapping.amount === -1) { alert('Please map the Amount column.'); return; }
  const results = [];
  for (const row of rows) {
    let amtRaw = row[mapping.amount] || '';
    amtRaw = String(amtRaw).replace(/[\$,]/g, '').trim();
    const neg = amtRaw.startsWith('(') && amtRaw.endsWith(')');
    if (neg) amtRaw = amtRaw.slice(1, -1);
    let amt = parseFloat(amtRaw);
    if (neg) amt = -amt;
    if (invertAmount) amt = -amt;
    if (isNaN(amt) || amt <= 0) continue;
    const desc = mapping.description >= 0 ? (row[mapping.description] || '').trim() : 'Imported';
    let date = todayStr();
    if (mapping.date >= 0 && row[mapping.date]) {
      const d = new Date(row[mapping.date]);
      if (!isNaN(d.getTime())) date = formatISO(d);
    }
    results.push({
      id: uid(), amount: amt, description: desc || 'Imported',
      category: categorize(desc), date, source: 'csv', selected: true,
    });
  }
  if (results.length === 0) { alert('No valid transactions found.'); return; }
  state.parseResults = results;
  state.modal = 'parse';
  state.csvData = null;
  render();
}

function confirmParseResults() {
  const toAdd = state.parseResults.filter(p => p.selected).map(({ selected, ...rest }) => rest);
  state.transactions = [...toAdd, ...state.transactions];
  state.parseResults = null;
  state.modal = null;
  saveState();
  render();
}

function exportData() {
  const data = JSON.stringify({
    categories: state.categories,
    transactions: state.transactions,
    fixedOverrides: state.fixedOverrides,
    favorites: state.favorites,
    exportedAt: new Date().toISOString(),
  }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `budget-tracker-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.categories || !data.transactions) throw new Error('Invalid backup file.');
      if (!confirm(`Import ${data.transactions.length} transactions and ${data.categories.length} categories? This replaces current data.`)) return;
      state.categories = normalizeCategories(data.categories);
      state.transactions = data.transactions;
      state.fixedOverrides = data.fixedOverrides || {};
      if (Array.isArray(data.favorites)) state.favorites = data.favorites;
      saveState();
      render();
      alert('Import complete!');
    } catch (err) { alert('Failed to import: ' + err.message); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function exportTxCSV() {
  const tx = getCurrentPeriodTx().sort((a, b) => b.date.localeCompare(a.date));
  const rows = [['Date','Description','Category','Amount','Source','PeriodOverride']];
  tx.forEach(t => rows.push([t.date, t.description, t.category, t.amount.toFixed(2), t.source, t.periodOverride ?? '']));
  const csv = rows.map(r => r.map(v => {
    const s = String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const { startISO, endISO } = getPeriodBounds(state.currentPeriodId);
  a.href = url; a.download = `transactions-${startISO}-to-${endISO}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function renderStats() {
  const variable = getSpendingByCategory();
  const totalVariableSpent = Object.values(variable).reduce((s, v) => s + v, 0);
  const totalFixed = state.categories.reduce((s, c) => s + getFixedForPeriod(state.currentPeriodId, c.name), 0);
  const totalBudget = state.categories.reduce((s, c) => s + (c.budget || 0), 0);
  const totalSelfCarry = state.categories.reduce((s, c) => s + getRolloverCarry(c.name, state.currentPeriodId), 0);
  const poolCarryIn = getPoolCarryIn(state.currentPeriodId);
  const totalCarry = totalSelfCarry + poolCarryIn;
  const totalSpent = totalVariableSpent + totalFixed;
  const remaining = totalBudget + totalCarry - totalSpent;
  const txCount = getCurrentPeriodTx().length;
  const carryShown = Math.abs(totalCarry) >= 0.005;

  return `
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Period Budget</div>
        <div class="stat-value">$${totalBudget.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>

        <div class="stat-label">Fixed Bills</div>

        <div class="stat-value">$${totalVariableSpent.toFixed(2)}</div>
        <div class="stat-sub">${txCount} transaction${txCount === 1 ? '' : 's'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Remaining</div>
        <div class="stat-value ${remaining < 0 ? 'negative' : 'positive'}">$${remaining.toFixed(2)}</div>
        ${carryShown ? `<div class="stat-sub">incl. ${totalCarry < 0 ? '−' : '+'}$${Math.abs(totalCarry).toFixed(2)} rolled over</div>` : ''}
      </div>
    </div>
  `;
}

function renderCategoryBreakdown() {
  const variable = getSpendingByCategory();
  return `
    <div class="panel" style="margin-bottom: 24px">
      <h2 style="margin-bottom: 16px">${ICONS.trend} Spending by Category</h2>
      <p class="help-text" style="margin-top:-12px; margin-bottom:16px">
        Variable spending + fixed bills (purple pill) for this period. Click the pill to adjust just this period.
      </p>
      ${renderPoolCard()}
      ${state.categories.map(cat => {
        const varSpent = variable[cat.name] || 0;
        const fixed = getFixedForPeriod(state.currentPeriodId, cat.name);
        const spent = varSpent + fixed;
        const base = cat.budget || 0;
        const mode = cat.rolloverMode || 'none';
        const hasFixed = cat.fixedMonthly > 0 || fixed > 0;
        const hasOverride = state.fixedOverrides[`${state.currentPeriodId}:${cat.name}`] !== undefined;
        const isEditing = state.openFixedEditor === cat.name;

        let denomBudget = base, pill = '', extraLine = '', barColor = cat.color, amountNegative = false;
        if (mode === 'self') {
          const carry = getRolloverCarry(cat.name, state.currentPeriodId);
          denomBudget = base + carry;
          const over = spent > denomBudget;
          amountNegative = over;
          barColor = over ? '#ef4444' : cat.color;
          const showCarry = Math.abs(carry) >= 0.005;
          pill = showCarry
            ? `<span class="rollover-pill ${carry < 0 ? 'negative' : ''}" title="Unspent budget carried in from earlier periods">${carry < 0 ? '−' : '+'}$${Math.abs(carry).toFixed(2)} rolled</span>`
            : `<span class="rollover-pill" title="Rolls unspent budget forward to itself">rolls over</span>`;
          extraLine = showCarry ? `<div class="rolled ${carry < 0 ? 'negative' : ''}">$${base.toFixed(2)} base ${carry < 0 ? '−' : '+'} $${Math.abs(carry).toFixed(2)} rolled</div>` : '';
        } else if (mode === 'pool') {
          denomBudget = base;
          const overBase = spent > base;
          barColor = overBase ? '#f59e0b' : cat.color;
          pill = overBase
            ? `<span class="pool-pill draw" title="Over base this period — the shortfall is drawn from the shared pool">over base → pool</span>`
            : `<span class="pool-pill" title="Unspent budget feeds the shared pool">→ pool</span>`;
        } else {
          denomBudget = base;
          const over = spent > base;
          amountNegative = over;
          barColor = over ? '#ef4444' : cat.color;
        }
        const pct = denomBudget > 0 ? (spent / denomBudget) * 100 : (spent > 0 ? 100 : 0);

        return `
          <div class="category-row">
            <div class="category-header">
              <div class="category-name">
                <div class="color-dot" style="background:${esc(cat.color)}"></div>
                <span>${esc(cat.name)}</span>
                ${hasFixed ? `<span class="fixed-pill" data-edit-fixed="${esc(cat.name)}" title="${esc(cat.fixedDescription)}">Fixed $${fixed.toFixed(2)}${hasOverride ? ' *' : ''}</span>` : ''}
                ${pill}
              </div>
              <div class="category-amount ${amountNegative ? 'negative' : ''}">
                $${spent.toFixed(2)} <span class="of">/ $${denomBudget.toFixed(2)}</span>${extraLine}
              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${Math.min(pct, 100)}%; background:${barColor}"></div>
            </div>
            ${hasFixed && isEditing ? `
              <div class="edit-fixed open">
                <label>Fixed amount for this period:</label>
                <div style="display:flex; align-items:center; gap:4px">
                  <span style="color:#64748b">$</span>
                  <input type="number" step="0.01" data-fixed-amount="${esc(cat.name)}" value="${fixed.toFixed(2)}">

                ${hasOverride ? `<button class="reset-btn" data-reset-fixed="${esc(cat.name)}">Reset to default</button>` : ''}

}

              <div class="flex-option-detail">${esc(newLabel)} · e.g. payday-evening guilt-free spending</div>
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderSettingsModal() {
  return `
    <div class="modal-backdrop" data-modal-bg>
      <div class="modal">
        <div class="modal-header">
          <h3>Categories &amp; Budgets</h3>
          <button class="icon-btn" id="close-settings">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          ${state.editingCats.map((c, i) => `
            <div class="cat-edit-block">
              <div class="cat-edit-row">
                <input type="color" data-cat-color="${i}" value="${esc(c.color)}">
                <input type="text" class="cat-name-input" data-cat-name="${i}" value="${esc(c.name)}" placeholder="Category name">
                <div class="budget-input">
                  <span>Per-period $</span>
                  <input type="number" step="0.01" data-cat-budget="${i}" value="${c.budget}" placeholder="0">
                </div>
                <button class="icon-btn" data-cat-delete="${i}" title="Delete">${ICONS.trash}</button>
              </div>

              <div class="fixed-fields">
                <label>Fixed monthly:</label>
                <div class="fixed-amount">
                  <span>$</span>
                  <input type="number" step="0.01" data-cat-fixed="${i}" value="${c.fixedMonthly || 0}" placeholder="0">
                  <span style="color:#94a3b8; font-size:12px; margin-left:8px">→ $${((c.fixedMonthly || 0) / 2).toFixed(2)} per period</span>
                </div>
                <label>Notes:</label>
                <input type="text" data-cat-desc="${i}" value="${esc(c.fixedDescription || '')}" placeholder="e.g. Rent $1,338">
              </div>

              <textarea data-cat-keywords="${i}" placeholder="Auto-match keywords (comma-separated): e.g. starbucks, coffee, cafe" style="font-size:12px; min-height:40px; margin-top:10px">${esc((c.keywords || []).join(', '))}</textarea>

              <div class="rollover-select">
                <label>Rollover:</label>
                <select data-cat-rollover="${i}">
                  <option value="none" ${(c.rolloverMode || 'none') === 'none' ? 'selected' : ''}>No rollover — resets each period</option>
                  <option value="self" ${c.rolloverMode === 'self' ? 'selected' : ''}>Rolls over to itself (own bucket)</option>
                  <option value="pool" ${c.rolloverMode === 'pool' ? 'selected' : ''}>Rolls into shared pool</option>
                </select>
              </div>
            </div>
          `).join('')}
          <button class="add-row-btn" id="add-cat">${ICONS.plus} Add category</button>
          <p class="help-text" style="margin-top: 16px">
            <strong>Per-period budget</strong> is the spending cap for one semi-monthly period (1st–15th or 16th–end of month).
            <strong>Fixed monthly</strong> auto-splits in half across the 2 periods of each month.
            <strong>Keywords</strong> auto-categorize transactions by merchant name.
            <strong>Rollover</strong>: "to itself" keeps unspent budget in that category's own bucket; "shared pool" combines the leftovers of every pooled category into one spendable cushion — any pooled category can overspend and the pool covers it. No cap either way.
          </p>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="cancel-settings">Cancel</button>
          <button class="btn-success" id="save-settings">Save</button>
        </div>
      </div>
    </div>
  `;
}

function renderFavoritesModal() {
  return `
    <div class="modal-backdrop" data-modal-bg>
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3>Quick-add favorites</h3>
            <p style="font-size:12px; color:#64748b; margin-top:4px">Saved one-tap expenses. Tapping a chip logs it to the period you're viewing.</p>
          </div>
          <button class="icon-btn" id="close-favs">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          ${state.editingFavs.length ? `
            <div class="fav-edit-row" style="font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px">

            <div class="fav-edit-row">

          </p>

        <div class="modal-footer">

          <button class="btn-success" id="save-favs">Save</button>

function renderParseModal() {
  const selectedCount = state.parseResults.filter(p => p.selected).length;
  return `
    <div class="modal-backdrop" data-modal-bg>
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3>Review imported transactions</h3>
            <p style="font-size:12px; color:#64748b; margin-top:4px">Uncheck unwanted ones, edit anything inline, then confirm</p>
          </div>
          <button class="icon-btn" id="close-parse">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          ${state.parseResults.map(p => `
            <div class="parse-row ${p.selected ? '' : 'unselected'}">
              <input type="checkbox" data-parse-toggle="${p.id}" ${p.selected ? 'checked' : ''}>
              <input type="text" class="desc-input" data-parse-desc="${p.id}" value="${esc(p.description)}">
              <input type="date" class="date-input" data-parse-date="${p.id}" value="${esc(p.date)}">
              <select data-parse-cat="${p.id}">
                ${state.categories.map(c => `<option value="${esc(c.name)}" ${c.name === p.category ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
              </select>
              <input type="number" class="amount-input" data-parse-amount="${p.id}" value="${p.amount.toFixed(2)}" step="0.01">
            </div>
          `).join('')}
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="cancel-parse">Cancel</button>
          <button class="btn-success" id="confirm-parse">${ICONS.check} Add ${selectedCount} transaction${selectedCount === 1 ? '' : 's'}</button>
        </div>
      </div>
    </div>
  `;
}

function renderCsvMappingModal() {
  const { headers, rows, mapping, invertAmount } = state.csvData;
  const previewRows = rows.slice(0, 3);
  return `
    <div class="modal-backdrop" data-modal-bg>
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3>Map your CSV columns</h3>
            <p style="font-size:12px; color:#64748b; margin-top:4px">Tell us which columns hold the date, description, and amount</p>
          </div>
          <button class="icon-btn" id="close-csv">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          <div class="csv-preview">
            <table>
              <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
              <tbody>${previewRows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>
          </div>
          <div class="map-row">
            <label>Date column:</label>
            <select id="map-date">
              <option value="-1">— None —</option>
              ${headers.map((h, i) => `<option value="${i}" ${mapping.date === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}
            </select>
          </div>
          <div class="map-row">
            <label>Description:</label>
            <select id="map-desc">
              <option value="-1">— None —</option>
              ${headers.map((h, i) => `<option value="${i}" ${mapping.description === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}
            </select>
          </div>
          <div class="map-row">
            <label>Amount:</label>
            <select id="map-amount">
              <option value="-1">— Select —</option>
              ${headers.map((h, i) => `<option value="${i}" ${mapping.amount === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}
            </select>
          </div>
          <div class="map-row">
            <label></label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:normal">
              <input type="checkbox" id="map-invert" ${invertAmount ? 'checked' : ''} style="width:auto">
              Amounts are negative for expenses (flip the sign)
            </label>
          </div>
          <p class="help-text" style="margin-top:12px">Rows with $0 or negative amounts (after flipping) are treated as credits and skipped.</p>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="cancel-csv">Cancel</button>
          <button class="btn-success" id="process-csv">${ICONS.check} Import</button>
        </div>
      </div>
    </div>
  `;
}

function attachListeners() {
  const prev = document.getElementById('prev-period');
  if (prev) prev.onclick = () => { state.currentPeriodId--; state.openFixedEditor = null; state.form.date = ''; render(); };
  const next = document.getElementById('next-period');
  if (next) next.onclick = () => { state.currentPeriodId++; state.openFixedEditor = null; state.form.date = ''; render(); };
  const goCur = document.getElementById('goto-current');
  if (goCur) goCur.onclick = () => { state.currentPeriodId = getCurrentPeriodId(); state.openFixedEditor = null; state.form.date = ''; render(); };

  const settingsBtn = document.getElementById('open-settings');
  if (settingsBtn) settingsBtn.onclick = () => {
    state.editingCats = JSON.parse(JSON.stringify(state.categories));
    state.modal = 'settings';
    render();
  };

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { state.inputTab = t.dataset.tab; render(); };
  });

  const manualText = document.getElementById('manual-text');
  if (manualText) {
    manualText.oninput = (e) => { state.manualText = e.target.value; };
    manualText.onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addManualEntry(); };
  }
  const addManual = document.getElementById('add-manual');
  if (addManual) addManual.onclick = addManualEntry;

  const fa = document.getElementById('form-amount');
  if (fa) fa.oninput = (e) => { state.form.amount = e.target.value; };
  const fd = document.getElementById('form-desc');
  if (fd) fd.oninput = (e) => { state.form.description = e.target.value; };
  const fdate = document.getElementById('form-date');
  if (fdate) fdate.oninput = (e) => { state.form.date = e.target.value; };
  const fc = document.getElementById('form-category');
  if (fc) fc.onchange = (e) => { state.form.category = e.target.value; };
  const addForm = document.getElementById('add-form');
  if (addForm) addForm.onclick = addFormEntry;

  const bt = document.getElementById('bulk-text');
  if (bt) bt.oninput = (e) => { state.bulkText = e.target.value; };
  const addBulk = document.getElementById('add-bulk');
  if (addBulk) addBulk.onclick = addBulkEntries;

  const uploadZone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');
  if (uploadZone && fileInput) {
    uploadZone.onclick = () => fileInput.click();
    fileInput.onchange = handleFileUpload;
  }

  const expTx = document.getElementById('export-tx');
  if (expTx) expTx.onclick = exportTxCSV;
  const expData = document.getElementById('export-data');
  if (expData) expData.onclick = exportData;
  const impBtn = document.getElementById('import-data-btn');
  const impInput = document.getElementById('import-input');
  if (impBtn && impInput) {
    impBtn.onclick = () => impInput.click();
    impInput.onchange = importData;
  }

  document.querySelectorAll('.tx-cat-select').forEach(s => {
    s.onchange = (e) => updateTxCategory(s.dataset.txId, e.target.value);
  });
  document.querySelectorAll('[data-delete-id]').forEach(b => {
    b.onclick = () => { if (confirm('Delete this transaction?')) deleteTransaction(b.dataset.deleteId); };
  });

  document.querySelectorAll('[data-edit-fixed]').forEach(pill => {
    pill.onclick = () => {
      const name = pill.dataset.editFixed;
      state.openFixedEditor = state.openFixedEditor === name ? null : name;
      render();
    };
  });
  document.querySelectorAll('[data-fixed-amount]').forEach(inp => {
    inp.onchange = (e) => {
      const name = inp.dataset.fixedAmount;
      const v = parseFloat(e.target.value);
      setFixedForPeriod(state.currentPeriodId, name, isNaN(v) ? 0 : v);
      render();
    };
  });
  document.querySelectorAll('[data-reset-fixed]').forEach(b => {
    b.onclick = () => { resetFixedForPeriod(state.currentPeriodId, b.dataset.resetFixed); render(); };
  });
  document.querySelectorAll('[data-close-fixed]').forEach(b => {
    b.onclick = () => { state.openFixedEditor = null; render(); };
  });

  document.querySelectorAll('[data-modal-bg]').forEach(bg => {
    bg.onclick = (e) => { if (e.target === bg) closeModal(); };
  });

  // Flex prompt
  document.querySelectorAll('[data-flex-choice]').forEach(b => {
    b.onclick = () => resolveFlexChoice(parseInt(b.dataset.flexChoice, 10));
  });
  const cancelFlex = document.getElementById('cancel-flex');
  if (cancelFlex) cancelFlex.onclick = cancelFlexChoice;

  // Settings modal
  const closeSettings = document.getElementById('close-settings');
  if (closeSettings) closeSettings.onclick = closeModal;
  const cancelSettings = document.getElementById('cancel-settings');
  if (cancelSettings) cancelSettings.onclick = closeModal;
  const saveSettings = document.getElementById('save-settings');
  if (saveSettings) saveSettings.onclick = () => {
    state.categories = state.editingCats
      .filter(c => c.name.trim())
      .map(c => ({
        name: c.name.trim(),
        budget: Number(c.budget) || 0,
        color: c.color,
        keywords: c.keywords || [],
        fixedMonthly: Number(c.fixedMonthly) || 0,
        fixedDescription: c.fixedDescription || '',
        rolloverMode: c.rolloverMode || 'none',
      }));
    state.modal = null;
    saveState();
    render();
  };

  document.querySelectorAll('[data-cat-name]').forEach(inp => {
    inp.oninput = (e) => { state.editingCats[+inp.dataset.catName].name = e.target.value; };
  });
  document.querySelectorAll('[data-cat-budget]').forEach(inp => {
    inp.oninput = (e) => { state.editingCats[+inp.dataset.catBudget].budget = Number(e.target.value) || 0; };
  });
  document.querySelectorAll('[data-cat-color]').forEach(inp => {
    inp.oninput = (e) => { state.editingCats[+inp.dataset.catColor].color = e.target.value; };
  });
  document.querySelectorAll('[data-cat-fixed]').forEach(inp => {
    inp.oninput = (e) => { state.editingCats[+inp.dataset.catFixed].fixedMonthly = Number(e.target.value) || 0; };
  });
  document.querySelectorAll('[data-cat-desc]').forEach(inp => {
    inp.oninput = (e) => { state.editingCats[+inp.dataset.catDesc].fixedDescription = e.target.value; };
  });
  document.querySelectorAll('[data-cat-keywords]').forEach(inp => {
    inp.oninput = (e) => {
      state.editingCats[+inp.dataset.catKeywords].keywords =
        e.target.value.split(',').map(s => s.trim()).filter(Boolean);
    };
  });
  document.querySelectorAll('[data-cat-rollover]').forEach(sel => {
    sel.onchange = (e) => { state.editingCats[+sel.dataset.catRollover].rolloverMode = e.target.value; };
  });
  document.querySelectorAll('[data-cat-delete]').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.catDelete;
      state.editingCats = state.editingCats.filter((_, idx) => idx !== i);
      render();
    };
  });
  const addCat = document.getElementById('add-cat');
  if (addCat) addCat.onclick = () => {
    state.editingCats.push({ name: '', budget: 0, color: '#6b7280', keywords: [], fixedMonthly: 0, fixedDescription: '', rolloverMode: 'none' });
    render();
  };

  // Quick-add favorites: chips + manage
  document.querySelectorAll('[data-fav-add]').forEach(b => {
    b.onclick = () => addFavorite(b.dataset.favAdd);
  });
  const manageFavs = document.getElementById('manage-favs');
  if (manageFavs) manageFavs.onclick = openFavoritesModal;

  // Favorites modal
  const closeFavs = document.getElementById('close-favs');
  if (closeFavs) closeFavs.onclick = closeModal;
  const cancelFavs = document.getElementById('cancel-favs');
  if (cancelFavs) cancelFavs.onclick = closeModal;
  const saveFavs = document.getElementById('save-favs');
  if (saveFavs) saveFavs.onclick = saveFavorites;
  document.querySelectorAll('[data-fav-label]').forEach(inp => {
    inp.oninput = (e) => { state.editingFavs[+inp.dataset.favLabel].label = e.target.value; };
  });
  document.querySelectorAll('[data-fav-amount]').forEach(inp => {
    inp.oninput = (e) => { state.editingFavs[+inp.dataset.favAmount].amount = e.target.value; };
  });
  document.querySelectorAll('[data-fav-cat]').forEach(s => {
    s.onchange = (e) => { state.editingFavs[+s.dataset.favCat].category = e.target.value; };
  });
  document.querySelectorAll('[data-fav-delete]').forEach(b => {
    b.onclick = () => {
      state.editingFavs = state.editingFavs.filter((_, idx) => idx !== +b.dataset.favDelete);
      render();
    };
  });
  const addFav = document.getElementById('add-fav');
  if (addFav) addFav.onclick = () => {
    const firstCat = state.categories[0] ? state.categories[0].name : 'Other';
    state.editingFavs.push({ id: uid(), label: '', amount: '', category: firstCat, description: '' });
    render();
  };

  // Parse modal
  const closeParse = document.getElementById('close-parse');
  if (closeParse) closeParse.onclick = closeModal;
  const cancelParse = document.getElementById('cancel-parse');
  if (cancelParse) cancelParse.onclick = closeModal;
  const confirmParse = document.getElementById('confirm-parse');
  if (confirmParse) confirmParse.onclick = confirmParseResults;
  document.querySelectorAll('[data-parse-toggle]').forEach(cb => {
    cb.onchange = (e) => {
      const id = cb.dataset.parseToggle;
      state.parseResults = state.parseResults.map(p => p.id === id ? { ...p, selected: e.target.checked } : p);
      render();
    };
  });
  document.querySelectorAll('[data-parse-cat]').forEach(s => {
    s.onchange = (e) => {
      const id = s.dataset.parseCat;
      state.parseResults = state.parseResults.map(p => p.id === id ? { ...p, category: e.target.value } : p);
    };
  });
  document.querySelectorAll('[data-parse-desc]').forEach(inp => {
    inp.oninput = (e) => {
      const id = inp.dataset.parseDesc;
      state.parseResults = state.parseResults.map(p => p.id === id ? { ...p, description: e.target.value } : p);
    };
  });
  document.querySelectorAll('[data-parse-date]').forEach(inp => {
    inp.oninput = (e) => {
      const id = inp.dataset.parseDate;
      state.parseResults = state.parseResults.map(p => p.id === id ? { ...p, date: e.target.value } : p);
    };
  });
  document.querySelectorAll('[data-parse-amount]').forEach(inp => {
    inp.oninput = (e) => {
      const id = inp.dataset.parseAmount;
      const v = parseFloat(e.target.value);
      state.parseResults = state.parseResults.map(p => p.id === id ? { ...p, amount: isNaN(v) ? p.amount : v } : p);
    };
  });

  // CSV mapping
  const closeCsv = document.getElementById('close-csv');
  if (closeCsv) closeCsv.onclick = closeModal;
  const cancelCsv = document.getElementById('cancel-csv');
  if (cancelCsv) cancelCsv.onclick = closeModal;
  const mapDate = document.getElementById('map-date');
  if (mapDate) mapDate.onchange = (e) => { state.csvData.mapping.date = parseInt(e.target.value, 10); };
  const mapDesc = document.getElementById('map-desc');
  if (mapDesc) mapDesc.onchange = (e) => { state.csvData.mapping.description = parseInt(e.target.value, 10); };
  const mapAmount = document.getElementById('map-amount');
  if (mapAmount) mapAmount.onchange = (e) => { state.csvData.mapping.amount = parseInt(e.target.value, 10); };
  const mapInvert = document.getElementById('map-invert');
  if (mapInvert) mapInvert.onchange = (e) => { state.csvData.invertAmount = e.target.checked; };
  const processCsv = document.getElementById('process-csv');
  if (processCsv) processCsv.onclick = processCsvMapping;
}

function closeModal() {
  state.modal = null;
  state.editingCats = [];
  state.editingFavs = [];
  state.parseResults = null;
  state.csvData = null;
  render();
}

loadState();
render();
</script>
</body>
</html>
